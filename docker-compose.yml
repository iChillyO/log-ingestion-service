# `docker compose up` with no .env and no arguments must produce the plain,
# unauthenticated core service. Everything below is that configuration.
#
# No top-level `version:` key - it has been obsolete since Compose v2 and
# strict validators reject `cpus`/`mem_limit` when it is present.

services:
  postgres:
    image: postgres:16-alpine
    container_name: logs-postgres
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Partition bounds are written as explicit UTC instants, but keeping the
      # server in UTC keeps EXPLAIN output and logs readable during a demo.
      TZ: UTC
      PGTZ: UTC
    command:
      - "postgres"
      # --- Memory (container limit is 1 GB) ---
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      # --- WAL / commit path ---
      # synchronous_commit=off is the single biggest ingest win: COPY no longer
      # waits for an fsync before returning. The exposure is bounded by
      # wal_writer_delay, and fsync itself stays on so the cluster survives a
      # crash. full_page_writes=off is a deliberate benchmark trade (documented
      # in the README) - with it off, wal_compression would have nothing left
      # to compress, so it is off too.
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_compression=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "fsync=on"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "wal_writer_delay=200ms"
      - "-c"
      - "max_wal_size=3GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_timeout=20min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      # --- Background writer: keep dirty pages moving so checkpoints are flat
      - "-c"
      - "bgwriter_delay=50ms"
      - "-c"
      - "bgwriter_lru_maxpages=800"
      # --- Planner ---
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "jit=off"
      - "-c"
      - "huge_pages=off"
      # Parallel query is left at Postgres' default costs. On a 1 vCPU cgroup
      # the workers share the same core, so aggressively lowering
      # parallel_setup_cost only steals CPU from ingestion.
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_worker_processes=8"
      # --- Connections: the app pool is ~10; the rest is headroom for psql ---
      - "-c"
      - "max_connections=50"
      # --- Logging: minimal, this is the hot path ---
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_min_error_statement=error"
      - "-c"
      - "logging_collector=off"
      # --- Autovacuum ---
      # `logs` is append-only and reclaims space by dropping partitions, so the
      # insert-driven trigger is what matters (freeze + visibility map).
      # `logs_rollup*` is upsert-heavy and gets per-table settings in the
      # migrations.
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_vacuum_insert_scale_factor=0.05"
      - "-c"
      - "autovacuum_naptime=15s"
      - "-c"
      - "autovacuum_vacuum_cost_delay=2ms"
      - "-c"
      - "autovacuum_vacuum_cost_limit=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m

  app:
    build:
      context: .
    container_name: logs-app
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://logs:logs@postgres:5432/logs
      LOG_LEVEL: warn
      # --- Ingest guardrails (not part of the required contract) ---
      INGEST_MAX_BATCH: "10000"
      INGEST_MAX_BODY_BYTES: "10485760"
      # --- Ingest pipeline: see README "Optimizations applied" ---
      INGEST_FLUSH_INTERVAL_MS: "15"
      INGEST_FLUSH_MAX_ROWS: "5000"
      INGEST_WRITERS: "3"
      INGEST_MAX_BUFFERED_ROWS: "120000"
      ROLLUP_FLUSH_INTERVAL_MS: "200"
      PG_POOL_MAX: "10"
      # --- Retention ---
      RETENTION_DAYS: "30"
      RETENTION_SWEEP_INTERVAL_MS: "300000"
      RETENTION_PARTITION_LOOKAHEAD_DAYS: "2"
      # --- Optional features: all off by default ---
      AUTH_ENABLED: "false"
      # 0.5 vCPU: a bigger libuv pool just adds context switches.
      UV_THREADPOOL_SIZE: "2"
      NODE_OPTIONS: "--max-old-space-size=192"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  postgres-data:
