services:
  postgres:
    image: postgres:16-alpine
    container_name: logs-postgres
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      # --- Memory ---
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      # --- WAL performance ---
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "fsync=on"
      - "-c"
      - "commit_delay=1000"
      - "-c"
      - "commit_siblings=2"
      - "-c"
      - "wal_writer_delay=200ms"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "checkpoint_timeout=15min"
      # --- Planner ---
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "huge_pages=off"
      - "-c"
      - "jit=off"
      # --- Connections ---
      - "-c"
      - "max_connections=100"
      # --- Logging (minimal for perf) ---
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_min_error_statement=error"
      - "-c"
      - "logging_collector=off"
      # --- Autovacuum tuning (aggressive for fresh COPY'd data) ---
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.02"
      - "-c"
      - "autovacuum_vacuum_insert_scale_factor=0.02"
      - "-c"
      - "autovacuum_naptime=10s"
      - "-c"
      - "autovacuum_vacuum_cost_delay=2ms"
      - "-c"
      - "autovacuum_vacuum_cost_limit=1000"
      # --- Parallelism for queries ---
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "parallel_tuple_cost=0.01"
      - "-c"
      - "parallel_setup_cost=100"
      # --- Planner tuning ---
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "from_collapse_limit=8"
      - "-c"
      - "join_collapse_limit=8"
      - "-c"
      - "plan_cache_mode=auto"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m

  app:
    build:
      context: .
    container_name: logs-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://logs:logs@postgres:5432/logs
      LOG_LEVEL: warn
      INGEST_MAX_BATCH: "10000"
      INGEST_MAX_BODY_BYTES: "10485760"
      RETENTION_DAYS: "30"
      RETENTION_SWEEP_INTERVAL_MS: "300000"
      RETENTION_PARTITION_LOOKAHEAD_DAYS: "2"
      AUTH_ENABLED: "false"
      UV_THREADPOOL_SIZE: "4"
      NODE_OPTIONS: "--max-old-space-size=200"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  postgres-data:
