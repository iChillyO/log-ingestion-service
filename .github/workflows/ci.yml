name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logs
          POSTGRES_PASSWORD: logs
          POSTGRES_DB: logs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U logs -d logs_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      TEST_DATABASE_URL: postgres://logs:logs@localhost:5432/logs_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (unit + integration)
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t log-ingestion-service:ci .

      - name: docker compose up + smoke test
        run: |
          set -euo pipefail
          docker compose up -d --build
          # Wait for /health
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "service is healthy"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/health
          # Ingest a small batch and verify shape
          RESP=$(curl -s -X POST http://localhost:8080/logs \
            -H 'content-type: application/json' \
            -d '{"logs":[{"timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","service":"ci","message":"smoke"}]}')
          echo "$RESP"
          echo "$RESP" | grep -q '"accepted":1'
          # Query with the exact contract
          curl -sf "http://localhost:8080/logs?service=ci" | grep -q '"logs"'
          SINCE=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          UNTIL=$(date -u -d '+1 minute' +%Y-%m-%dT%H:%M:%SZ)
          curl -sf "http://localhost:8080/logs/aggregate?since=$SINCE&until=$UNTIL&bucket=1m" | grep -q '"buckets"'
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"

      - name: Print app logs on failure
        if: failure()
        run: docker compose logs app postgres

      - name: Compose down
        if: always()
        run: docker compose down -v
